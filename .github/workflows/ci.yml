name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  COSIGN_VERSION: v2.4.1
  COSIGN_SHA256: 8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b
  SCII_VERIFY_REV: 1c4ac0ffbc5278c493db8a3ed8eae5cf8eef85e3
  RUST_TOOLCHAIN: 1.97.0

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: cosign (SHA-256 закреплён)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/bin/cosign" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/bin/cosign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: scii-agent из scii-verify (коммит закреплён)
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          cargo "+$RUST_TOOLCHAIN" install --locked --root "$RUNNER_TEMP" \
            --git https://github.com/alexqzm/scii-verify --rev "$SCII_VERIFY_REV" scii-agent
      - name: Установка
        run: python -m pip install -e ".[test,mcp]"
      - name: Инструменты
        run: cpslab doctor
      - name: Статический анализ
        run: python -m pyflakes cpslab tests
      - name: Тесты (модульные, интеграционные, живые)
        env:
          CPSLAB_REQUIRE_TOOLS: "1"
        run: python -m pytest -q
      - name: Таблица результатов и README совпадают с прогоном
        env:
          CPSLAB_HOME: ${{ runner.temp }}/lab
        run: |
          cpslab init
          cpslab scenario matrix --md docs/results.md --readme README.md --check
      - name: Канал рецептов — таблица и README совпадают с прогоном
        env:
          CPSLAB_HOME: ${{ runner.temp }}/lab
        run: cpslab recipes matrix --md docs/results-recipes.md --readme README.md --check

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Сборка образа и запуск стенда
        run: ./lab.sh up
      - name: Сценарий A1 на живом стенде, L0 и L2
        run: |
          ./lab.sh scenario A1 0 | tee "$RUNNER_TEMP/a1-l0.log"
          grep -q "'accepted': True, 'reason': 'OK'" "$RUNNER_TEMP/a1-l0.log"
          grep -q "аварии: ПЕРЕЛИВ" "$RUNNER_TEMP/a1-l0.log"
          grep -q "монитор: на устройстве работает образ, не допущенный гейтом" "$RUNNER_TEMP/a1-l0.log"
          ./lab.sh scenario A1 2 | tee "$RUNNER_TEMP/a1-l2.log"
          grep -q "'accepted': False, 'reason': 'DIGEST'" "$RUNNER_TEMP/a1-l2.log"
          grep -q "аварии: нет" "$RUNNER_TEMP/a1-l2.log"
      - name: HMI отвечает
        run: |
          curl -sSf http://127.0.0.1:8081/ | grep -q "<svg"
          curl -sSf http://127.0.0.1:8081/api/status | grep -q '"name": "plc-1"'
      - name: Сервер агента и мост MCP
        run: |
          key="$(docker compose run --rm --no-deps -T --entrypoint cat tools /lab/agent/keys/observer.key)"
          curl -sSf -H "Authorization: Bearer ${key}" -H "Content-Type: application/json" \
            -d '{"tool": "describe_machine"}' http://127.0.0.1:8026/api/call | tee "$RUNNER_TEMP/agent.json"
          grep -q '"session_tier": "Read"' "$RUNNER_TEMP/agent.json"
          printf '%s\n' \
            '{"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-06-18", "capabilities": {}, "clientInfo": {"name": "ci", "version": "0"}}}' \
            '{"jsonrpc": "2.0", "method": "notifications/initialized"}' \
            '{"jsonrpc": "2.0", "id": 2, "method": "tools/list"}' \
            | docker compose run --rm --no-deps -T tools mcp --url http://agent-server:8026 \
                --key-file /lab/agent/keys/observer.key | tee "$RUNNER_TEMP/mcp.log"
          grep -q '"protocolVersion": "2025-06-18"' "$RUNNER_TEMP/mcp.log"
          grep -q '"name": "dry_run"' "$RUNNER_TEMP/mcp.log"
      - name: Канал рецептов на живом стенде (агент, оператор, гейт, контроллер L2)
        run: |
          ./lab.sh cli live recipe-demo --observe 45 | tee "$RUNNER_TEMP/recipe.log"
          grep -q "гейт рецептов: допуск" "$RUNNER_TEMP/recipe.log"
          grep -q "агент запускает рецепт: принято OK" "$RUNNER_TEMP/recipe.log"
          grep -q "рецепт completed, партия ok" "$RUNNER_TEMP/recipe.log"
          ./lab.sh journal | tail -1 | grep -q '"ok": true'
      - name: Все сценарии в контейнере
        run: |
          ./lab.sh matrix
          ./lab.sh recipes
      - name: source-match в образе (ЛР-6)
        run: |
          set +e
          ./lab.sh cli --version
          docker compose run --rm --no-deps -T --entrypoint source-match tools check \
            --repo /lab/vendor/src --tag tank-controller/v1.1.0 \
            --archive /lab/vendor/releases/tank-1.1.0-from-archive/source/tank-controller-1.1.0.tar.gz \
            --gpg-key /lab/gate/keys/tag_signers.asc
          code=$?
          echo "код возврата source-match: $code"
          test "$code" -eq 30
      - name: Журналы служб
        if: failure()
        run: docker compose logs --no-color
      - name: Остановка
        if: always()
        run: ./lab.sh reset

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint 1.7.12 (SHA-256 закреплён)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: shellcheck
        run: shellcheck lab.sh docker/cpslab docker/source-match
      - name: compose.yaml
        run: docker compose config -q
